<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — VEVORA</title>
    <style>
      :root {
        --white: #ffffff;
        --ink: #111111;
        --ink-2: #666666;
        --surface: #eeeeee;
        --sky: #38bdf8;
        --sky-surface: #e0f2fe;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--white);
        color: var(--ink);
        font-family: 'Segoe UI Variable Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .container {
        width: 70%;
        margin-inline: auto;
      }

      header {
        border-bottom: 1px solid #f2f2f2;
      }

      .header__inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 84px;
      }

      /* The logo is cropped so its own off-white background stays close to the mark; the logo itself is unchanged. */
      .logo-crop {
        display: block;
        position: relative;
        width: 50px;
        height: 36px;
        overflow: hidden;
      }

      .logo {
        position: absolute;
        left: -18.6px;
        top: -10.75px;
        width: 85.5px;
        height: auto;
        max-width: none;
      }

      .lang {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        border-radius: 999px;
        color: var(--ink);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .lang svg {
        width: 16px;
        height: 16px;
        color: var(--ink-2);
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-block: 8px 48px;
      }

      .art {
        width: 640px;
        height: auto;
        display: block;
      }

      h1 {
        margin: 44px 0 0;
        font-size: 46px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      p {
        margin: 16px 0 0;
        max-width: 640px;
        color: var(--ink-2);
        font-size: 20px;
        line-height: 1.55;
      }

      .button {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 44px;
        height: 62px;
        padding: 0 36px 0 30px;
        border-radius: 999px;
        background: var(--sky);
        color: var(--ink);
        font-size: 19px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 8px 24px -12px rgb(14 165 233 / 0.55);
      }

      .button svg {
        width: 22px;
        height: 22px;
      }

      footer {
        padding-bottom: 28px;
        color: #a3a3a3;
        font-size: 14px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header__inner">
        <a class="logo-crop" href="/" aria-label="VEVORA home">
          <img class="logo" src="../VEVORA%20logo-2.png" width="525" height="372" alt="VEVORA" />
        </a>
        <span class="lang">
          EN
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6l6 -6" /></svg>
        </span>
      </div>
    </header>

    <main class="container">
      <svg class="art" viewBox="0 0 760 340" role="img" aria-label="404">
        <defs>
          <radialGradient id="light" cx="0.62" cy="0.45" r="0.75">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="0.45" stop-color="#e0f2fe" />
            <stop offset="1" stop-color="#7dd3fc" />
          </radialGradient>
          <linearGradient id="leaf" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#0d0d0d" />
            <stop offset="1" stop-color="#2a2a2a" />
          </linearGradient>
          <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28" />
            <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#000000" stop-opacity="0.10" />
            <stop offset="1" stop-color="#000000" stop-opacity="0" />
          </radialGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" />
          </filter>
        </defs>

        <!-- ground shadows and light spill -->
        <ellipse cx="148" cy="302" rx="110" ry="9" fill="url(#shadow)" />
        <ellipse cx="612" cy="302" rx="110" ry="9" fill="url(#shadow)" />
        <ellipse cx="392" cy="304" rx="150" ry="18" fill="url(#spill)" />

        <!-- 4 -->
        <path
          d="M182 296 V244 H64 V212 L170 66 H220 V212 H252 V244 H220 V296 Z M182 212 V118 L114 212 Z"
          fill="#111111"
          fill-rule="evenodd"
        />

        <!-- 0 as a slightly opened door -->
        <g>
          <rect x="290" y="62" width="184" height="236" rx="46" fill="#111111" />
          <rect x="326" y="98" width="112" height="164" rx="16" fill="url(#light)" />
          <!-- soft glow inside opening -->
          <rect x="360" y="108" width="70" height="146" rx="14" fill="#ffffff" opacity="0.5" filter="url(#soft)" />
          <!-- door leaf, hinged left, swung inward -->
          <path d="M326 110 Q326 98 338 98 L384 110 L384 252 L338 262 Q326 262 326 250 Z" fill="url(#leaf)" />
          <!-- lit free edge and handle -->
          <path d="M384 110 L384 252" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
          <circle cx="374" cy="184" r="4" fill="#38bdf8" />
        </g>

        <!-- 4 -->
        <path
          d="M646 296 V244 H528 V212 L634 66 H684 V212 H716 V244 H684 V296 Z M646 212 V118 L578 212 Z"
          fill="#111111"
          fill-rule="evenodd"
        />
      </svg>

      <h1>This page couldn’t be found.</h1>
      <p>The link may be incorrect, or the page may have moved.<br />Let’s get you back home.</p>
      <a class="button" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12l-2 0l9 -9l9 9l-2 0" />
          <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" />
          <path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" />
        </svg>
        Back to homepage
      </a>
    </main>

    <footer>© VEVORA</footer>
  </body>
</html>
